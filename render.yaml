services:
  - type: web
    name: slook
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - { key: DATABASE_URL, fromDatabase: { name: slook-db, property: connectionString } }
      - { key: LIVE_PAYPAL, value: "false" }   # set "true" after adding sandbox credentials
      - { key: PAYPAL_ENV, value: sandbox }
      - { key: APP_BASE_URL, sync: false }
      - { key: PAYPAL_CLIENT_ID, sync: false }
      - { key: PAYPAL_CLIENT_SECRET, sync: false }
      - { key: PAYPAL_WEBHOOK_ID, sync: false }
      - { key: ANTHROPIC_API_KEY, sync: false }
      - { key: AI_PROVIDER, value: anthropic }
      - { key: AI_MODEL, value: claude-sonnet-5-5 }
      - { key: INTERNAL_ACTION_KEY, generateValue: true }
      - { key: INTENT_SIGNING_KEY, sync: false }   # npm run gen:key  (Ed25519 PKCS8 DER, base64)
      - { key: REPLAY_MODE, value: "true" }
      - { key: NODE_ENV, value: production }
databases:
  - name: slook-db
    plan: free
